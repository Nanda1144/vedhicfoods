# =============================================================================
# Render Blueprint - Vedhic Foods API + Postgres + Key Value (Redis)
#
# OPTIONAL. The dashboard steps in the deployment guide work without this file.
# To use it: Render Dashboard -> New -> Blueprint -> point at this repo. Render
# reads this file from the repository root.
#
# READ BEFORE SYNCING
#   - rootDir MUST stay the repo root (`.`). `backend` depends on the
#     `vedhicfoods-database` npm workspace, which npm only links from the root.
#   - `NODE_ENV=production` makes backend/src/config/env.ts refuse to boot until
#     every REQUIRED value below is REAL (not a placeholder): JWT_SECRET >= 32,
#     ENCRYPTION_KEY >= 32, both *_FRONTEND_URL as https origins, TRUST_PROXY
#     resolved (Render sets RENDER=true, which autodefaults TRUST_PROXY=1),
#     REDIS_URL present. The `sync: false` entries are prompted for on first sync.
#   - Razorpay credentials are NOT boot requirements: they are configured at
#     runtime from the Admin -> Payment Settings screen and stored encrypted.
#     PAYMENT_CREDENTIALS_ENCRYPTION_KEY protects those stored secrets and is
#     required before an admin can SAVE credentials in production. Leaving the
#     RAZORPAY_* variables unset is fine and is the recommended flow; setting a
#     placeholder is treated as unconfigured.
#   - TRUST_PROXY: with NODE_ENV=production and RENDER=true the backend defaults
#     it to 1 (a single TLS-terminating proxy). An explicit TRUST_PROXY always
#     wins; set it only if you add another proxy hop.
#   - Health check is the LIVENESS probe (/api/v1/health), not /health/ready:
#     a transient DB blip must not make Render restart-loop a healthy instance.
#   - Plans below are the cheapest, for a first/test deploy. For production:
#       web       -> 0.5c-512mb  (free spins down after inactivity)
#       database  -> 0.5c-1g     (free Postgres EXPIRES after 90 days)
#       keyvalue  -> 256mb       (free is 25 MB)
#   - `preDeployCommand` (the migration) needs a paid instance. On a free plan
#     Render skips it, so run migrations manually (see the guide, step 6).
# =============================================================================

databases:
  - name: vedhicfoods-db
    databaseName: vedhicfoods
    user: vedhicfoods
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: vedhicfoods-redis
    plan: free
    region: singapore
    ipAllowList: [] # internal connections only

  - type: web
    name: vedhicfoods-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:database && npm run build:backend
    startCommand: node backend/dist/bootstrap.js
    healthCheckPath: /api/v1/health
    preDeployCommand: npm run prisma:deploy
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vedhicfoods-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vedhicfoods-redis
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      # 256-bit base64, generated once by Render. Never placed in git.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Dedicated key for admin-managed payment credentials (AES-256-GCM, v2).
      # Generated once; never rotate it while encrypted credentials exist.
      - key: PAYMENT_CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      # OPTIONAL. Prefer configuring the gateway from the Admin UI so the
      # credentials live encrypted in the database. These env vars only act as a
      # bootstrap fallback for the very first deploy; a placeholder value counts
      # as "not configured" once NODE_ENV=production.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: LOG_LEVEL
        value: info
