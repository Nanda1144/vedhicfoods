# =============================================================================
# Automated daily PostgreSQL backup to Amazon S3
#
# WHAT RUNS
#   `database/scripts/backup-to-s3.mjs` dumps the database with pg_dump (custom
#   format), validates the archive with pg_restore, uploads it to S3, verifies the
#   uploaded byte count, and deletes backups older than BACKUP_RETENTION_DAYS.
#   The script is the single source of truth for behaviour; this workflow only
#   supplies credentials and configuration. See database/README.md
#   ("Automated backups") for the full reference.
#
# AUTHENTICATION - GitHub OIDC, not stored keys (same model as deploy.yml):
#   A short-lived OIDC token is exchanged for credentials scoped to one IAM role.
#   Nothing long-lived is stored in the repository or on the runner.
#
# SECRET HANDLING:
#   - No database credential is stored in GitHub. DATABASE_URL is read at run
#     time from AWS Secrets Manager (the same secret the backend task already
#     uses), then masked with ::add-mask:: so it cannot appear in a log.
#   - The script never places the password on a command line; pg_dump receives
#     it through PGPASSWORD in the environment.
#
# REQUIRED REPOSITORY VARIABLES (Settings -> Secrets and variables -> Actions ->
# Variables; none of these is confidential):
#   AWS_REGION               Every aws call and the OIDC session region.
#   AWS_BACKUP_ROLE_ARN      OIDC role this workflow assumes. It needs, scoped to
#                            the backup bucket, s3:PutObject, s3:GetObject,
#                            s3:ListBucket, s3:DeleteObject (and s3:AbortMultipart
#                            Upload), plus secretsmanager:GetSecretValue on the
#                            DATABASE_URL secret below.
#   BACKUP_S3_BUCKET         Destination bucket (create a dedicated, versioned,
#                            encrypted, non-public bucket; do NOT reuse the media
#                            bucket).
#   BACKUP_S3_PREFIX         Optional key prefix; defaults to database-backups/.
#   BACKUP_RETENTION_DAYS    Optional; defaults to 30.
#   DATABASE_URL_SECRET_ID   Secrets Manager name/ARN of the connection string.
#                            Defaults to vedhicfoods/backend/DATABASE_URL, the
#                            secret create-secrets.ps1 already creates.
#
# SECRETS: none are required in GitHub. The database URL stays in AWS Secrets
#   Manager.
#
# IAM TRUST: add a trust policy for this workflow's ref to the backup role (the
#   scheduled run uses the default branch). The deploy role's example trust in
#   backend/infra/README.md is the template; scope `sub` to this repository and,
#   rather than pinning only refs/heads/main, allow the branch the schedule runs
#   on. Do not widen it to any repository.
# =============================================================================

name: Database Backup

on:
  # 19:00 UTC = 00:30 IST. Scheduled workflows run on the default branch; if the
  # default branch is not `main`, adjust the role trust policy accordingly.
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Delete backups older than this many days (blank = repository variable)'
        required: false
        default: ''
      dry_run:
        description: 'Create and validate the dump without uploading it'
        type: boolean
        default: false

# A backup is quick and idempotent per run; queue rather than cancel so a manual
# run cannot stop the nightly one mid-upload.
concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read
  # Mint the OIDC token that configure-aws-credentials exchanges.
  id-token: write

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION }}
  BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
  BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
  BACKUP_RETENTION_DAYS: ${{ github.event.inputs.retention_days || vars.BACKUP_RETENTION_DAYS || '30' }}
  BACKUP_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  DB_SECRET_ID: ${{ vars.DATABASE_URL_SECRET_ID || 'vedhicfoods/backend/DATABASE_URL' }}

jobs:
  backup:
    name: pg_dump -> S3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Assert configuration is present
        # Fail early with a named variable, rather than inside the script with a
        # generic AWS authorization error that reads like a permissions problem.
        run: |
          set -euo pipefail
          missing=()
          [ -n "$AWS_REGION" ]    || missing+=("vars.AWS_REGION")
          [ -n "$BACKUP_ROLE_ARN" ] || missing+=("vars.AWS_BACKUP_ROLE_ARN")
          [ -n "$BACKUP_S3_BUCKET" ] || missing+=("vars.BACKUP_S3_BUCKET")
          [ -n "$DB_SECRET_ID" ]  || missing+=("vars.DATABASE_URL_SECRET_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository variables: ${missing[*]}"
            exit 1
          fi
        env:
          BACKUP_ROLE_ARN: ${{ vars.AWS_BACKUP_ROLE_ARN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ubuntu-latest ships a PostgreSQL client, but pin the fallback so a runner
      # image change does not leave pg_dump absent. The client major version must
      # be >= the server's; check with `pg_dump --version` in the log.
      - name: Ensure PostgreSQL client
        run: |
          set -euo pipefail
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          pg_dump --version

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-db-backup-${{ github.run_id }}

      - name: Fetch DATABASE_URL from Secrets Manager
        # The credential is never stored in GitHub. `::add-mask::` registers it
        # with the log filter, and the heredoc keeps any special characters out
        # of the GITHUB_ENV parser.
        run: |
          set -euo pipefail
          url=$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_ID" \
            --query SecretString --output text)
          if [ -z "$url" ] || [ "$url" = "None" ]; then
            echo "::error::Secret $DB_SECRET_ID returned no value."
            exit 1
          fi
          echo "::add-mask::$url"
          {
            echo "DATABASE_URL<<VF_BACKUP_EOF"
            echo "$url"
            echo "VF_BACKUP_EOF"
          } >> "$GITHUB_ENV"

      - name: Run backup
        # BACKUP_S3_BUCKET/PREFIX/RETENTION_DAYS/DRY_RUN come from the workflow
        # env; DATABASE_URL was written to GITHUB_ENV by the previous step.
        run: node database/scripts/backup-to-s3.mjs

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Database backup ${JOB_STATUS}"
            echo ""
            echo "- Target: \`s3://${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX:-database-backups/}\`"
            echo "- Retention: ${BACKUP_RETENTION_DAYS} day(s)"
            echo "- Dry run: ${BACKUP_DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
